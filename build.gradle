plugins {
    id 'java'
}

group = 'be.dailysurvival.be'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // Paper 26.1.x uses the new "{VERSION}.build.+" version format
    // (the old 1.x.x-R0.1-SNAPSHOT format ended with 1.21.11)
    compileOnly "io.papermc.paper:paper-api:26.1.2.build.+"
}

// Minecraft/Paper 26.1 requires Java 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

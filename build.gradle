plugins {
    id 'java'
}

group = 'be.dailysurvival.be'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // Compile against the OLDEST supported API (1.21) so the plugin can't
    // accidentally use newer APIs. The same jar runs on every Paper server
    // from 1.21.x up to and including 26.1.x.
    compileOnly "io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT"
}

// Java 21 bytecode: required minimum for MC 1.21+, and newer servers
// (26.1.x runs on Java 25) load Java 21 class files without issues.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
